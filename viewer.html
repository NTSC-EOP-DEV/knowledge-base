<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读 · 知识库</title>
<link rel="stylesheet" href="assets/base.css">
</head>
<body>
<div id="bar"></div>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="./">知识<span>库</span></a>
    <nav>
      <a href="./">← 返回目录</a>
      <a id="gh-link" href="https://github.com/NTSC-EOP-DEV/knowledge-base" target="_blank" rel="noopener">在 GitHub 查看</a>
    </nav>
  </div>
</header>

<main class="reader wrap">
  <div class="reader-layout">
    <article class="article" id="content">
      <div class="loading" id="loading">正在加载文档…</div>
    </article>
    <aside class="toc" id="toc" hidden>
      <h4>目录</h4>
      <div id="toc-list"></div>
    </aside>
  </div>
  <div class="reader-note" id="note" hidden></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var doc = params.get('doc') || '';
  var content = document.getElementById('content');
  var loading = document.getElementById('loading');
  var toc = document.getElementById('toc');
  var tocList = document.getElementById('toc-list');
  var note = document.getElementById('note');
  var gh = document.getElementById('gh-link');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fail(msg) {
    content.innerHTML = '<h1>无法打开文档</h1><p>' + esc(msg) + '</p>' +
      '<p><a href="./">返回目录</a></p>';
    if (loading) loading.remove();
  }

  var okPath = /^docs\/[A-Za-z0-9_\-\u4e00-\u9fa5/]+\.md$/.test(doc);
  if (!okPath) { fail('缺少文档参数，或路径不合法。'); return; }

  gh.href = 'https://github.com/NTSC-EOP-DEV/knowledge-base/blob/main/' + doc.split('/').map(encodeURIComponent).join('/');

  fetch(doc).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function (text) {
    if (typeof marked === 'undefined') { fail('Markdown 渲染库加载失败，请检查网络后刷新。'); return; }
    content.innerHTML = marked.parse(text);
    if (loading) loading.remove();

    var h1 = content.querySelector('h1');
    var title = h1 ? h1.textContent : doc.split('/').pop().replace(/\.md$/, '');
    document.title = title + ' · 知识库';

    var meta = document.createElement('div');
    meta.className = 'reader-meta';
    meta.textContent = doc;
    content.insertBefore(meta, content.firstChild);

    var used = {};
    var heads = content.querySelectorAll('h2, h3');
    heads.forEach(function (h, i) {
      var id = h.id || ('sec-' + (i + 1));
      h.id = id;
      if (used[id]) return;
      used[id] = 1;
      var a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = h.textContent;
      if (h.tagName === 'H3') a.className = 'lv3';
      tocList.appendChild(a);
    });
    if (heads.length) toc.hidden = false;

    note.hidden = false;
    note.innerHTML = '本文同时提供 <a href="' + encodeURI(doc.replace(/\.md$/, '.html')) + '">网页排版版</a>；' +
      '原始文件见 <a href="' + gh.href + '" target="_blank" rel="noopener">GitHub</a>。';
  }).catch(function (e) {
    fail('读取 ' + doc + ' 失败：' + e.message);
  });

  var bar = document.getElementById('bar');
  document.addEventListener('scroll', function () {
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
  }, { passive: true });
})();
</script>
</body>
</html>
